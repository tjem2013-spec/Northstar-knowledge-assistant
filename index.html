<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Knowledge Assistant</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172238}.top{height:70px;background:#fff;border-bottom:1px solid #e4e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:11px;background:#173b72;color:#fff;display:grid;place-items:center;font-weight:800}.brand b,.brand small{display:block}.brand small{color:#7b8493}.nav{border:0;background:#edf3ff;color:#173b72;padding:10px 14px;border-radius:9px;font-weight:700}.wrap{max-width:1160px;margin:auto;padding:48px 20px}.hero{text-align:center;max-width:850px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.14em;color:#4770aa;font-weight:800}.hero h1{font-size:42px;margin:10px 0}.hero p{color:#657084;font-size:17px;line-height:1.55}.notice{margin:25px auto 32px;text-align:left;background:#eef5ff;border:1px solid #d5e5ff;padding:14px 17px;border-radius:14px;color:#355a8c;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:17px;overflow:hidden;box-shadow:0 8px 25px rgba(25,45,75,.05)}.head{padding:18px 20px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between}.head small{display:block;color:#8a93a1;margin-top:4px}.status{font-size:11px;color:#3c7852}.samples{padding:18px;display:grid;gap:9px}.samples button{border:1px solid #e1e7ef;background:#f7f9fc;text-align:left;padding:11px;border-radius:10px;cursor:pointer;color:#344257}.input{padding:0 18px}.input textarea{width:100%;min-height:110px;border:1px solid #dce3ed;border-radius:11px;padding:13px;resize:vertical;font:inherit}.ask{width:100%;border:0;border-radius:10px;background:#173b72;color:#fff;padding:12px;margin-top:9px;font-weight:700;cursor:pointer}.hint{font-size:10px;color:#9aa3af;padding:10px 18px 18px}.error{margin:10px 18px;background:#fff0f0;color:#a33;padding:10px;border-radius:8px;font-size:12px}.empty,.loading{height:390px;display:grid;place-content:center;text-align:center;color:#7b8595;padding:30px}.empty strong{color:#445166}.answer{padding:20px}.confidence{display:inline-block;background:#edf8f1;color:#32734c;padding:6px 9px;border-radius:20px;font-size:11px}.answer p{font-size:14px;line-height:1.65;color:#3e4859}.source{margin-top:8px;background:#f6f8fb;padding:9px;border-radius:8px;font-size:12px}.source b{color:#4a70a5;margin-right:8px}.feedback{margin-top:18px;font-size:11px;color:#788292}.feedback button{margin-left:7px;border:1px solid #dfe5ee;background:#fff;padding:7px 10px;border-radius:8px}.trust{margin-top:20px;background:#fff;border:1px solid #e3e8ef;border-radius:15px;padding:17px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.trust b,.trust span{display:block}.trust span{color:#818b9a;font-size:11px;margin-top:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.trust{grid-template-columns:1fr}.top{padding:0 18px}}
</style></head><body><div id="root"></div><script type="text/babel">
const {useState}=React;const samples=['How do I schedule a service appointment?','Who should I contact about a billing problem?','How do I change or cancel an appointment?','What should happen if there is a safety concern?'];
function App(){const[q,setQ]=useState(''),[a,setA]=useState(null),[loading,setLoading]=useState(false),[err,setErr]=useState(''),[fb,setFb]=useState(null),[stats,setStats]=useState(null),[show,setShow]=useState(false);async function ask(text=q){text=text.trim();if(!text)return setErr('Please enter a question first.');setLoading(true);setErr('');setA(null);try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:text})}),d=await r.json();if(!r.ok)throw Error(d.error);setA(d)}catch(e){setErr(e.message||'Something went wrong.')}finally{setLoading(false)}}async function feedback(v){setFb(v);await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({helpful:v})})}async function dashboard(){let r=await fetch('/api/stats');setStats(await r.json());setShow(true)}return <><header className="top"><div className="brand"><div className="logo">N</div><div><b>Northstar</b><small>Home Services</small></div></div><button className="nav" onClick={dashboard}>Usage Insights</button></header><main className="wrap"><section className="hero"><div className="eyebrow">AI CUSTOMER SUPPORT • GROUNDED KNOWLEDGE</div><h1>Northstar Knowledge Assistant</h1><p>Ask questions in plain language and get concise answers grounded in Northstar's approved knowledge base.</p><div className="notice"><b>Grounded response mode</b><br/>Answers are based on retrieved Northstar knowledge. Account-specific decisions should be verified by a support representative.</div></section><section className="grid"><div className="card"><div className="head"><div><b>Ask a question</b><small>Try a sample or type your own</small></div><span className="status">● Knowledge base online</span></div><div className="samples">{samples.map((s,i)=><button key={i} onClick={()=>{setQ(s);ask(s)}}>{s}</button>)}</div><div className="input"><textarea value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}}} placeholder="Ask about scheduling, billing, service areas, cancellations..."></textarea><button className="ask" disabled={loading} onClick={()=>ask()}>{loading?'Thinking...':'Ask Northstar'}</button></div>{err&&<div className="error">{err}</div>}<div className="hint">Press Enter to ask • Shift+Enter for a new line</div></div><div className="card"><div className="head"><div><b>Assistant response</b><small>Transparent, grounded answers</small></div></div>{!a&&!loading&&<div className="empty"><div>✦</div><strong>Your answer will appear here</strong><div>Ask a question to retrieve relevant Northstar knowledge.</div></div>}{loading&&<div className="loading">Retrieving relevant knowledge…</div>}{a&&!loading&&<div className="answer"><span className="confidence">Confidence: <b>{a.confidence}</b></span><p>{a.answer}</p><b>Sources used</b>{a.sources.map(s=><div className="source" key={s.id}><b>{s.id}</b>{s.title}</div>)}<div className="feedback">Was this helpful? <button onClick={()=>feedback(true)}>{fb===true?'✓ ':''}Yes</button><button onClick={()=>feedback(false)}>{fb===false?'✓ ':''}No</button></div></div>}</div></section><section className="trust"><div><b>Responsible AI</b><span>Grounded responses • Clear limitations</span></div><div><b>Knowledge Base</b><span>5 approved Northstar sources</span></div><div><b>Human Oversight</b><span>Support representatives verify account details</span></div></section></main>{show&&<div style={{position:'fixed',inset:0,background:'#0007',display:'grid',placeItems:'center'}} onClick={()=>setShow(false)}><div style={{background:'#fff',padding:25,borderRadius:16,width:'min(500px,90%)'}} onClick={e=>e.stopPropagation()}><h2>Usage Insights</h2><p>Questions: <b>{stats?.questions}</b></p><p>Helpful: <b>{stats?.helpful}</b></p><p>Needs improvement: <b>{stats?.notHelpful}</b></p><button className="ask" onClick={()=>setShow(false)}>Close</button></div></div>}</>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
